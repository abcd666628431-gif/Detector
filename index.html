        // --- Detection Logic (v3.0) ---
        function detectMotion() {
            if (!isMonitoring || !videoElement.videoWidth) {
                if (isMonitoring) animationFrameId = requestAnimationFrame(detectMotion);
                return;
            }
            
            const now = Date.now();
            const intervalSeconds = parseFloat(checkIntervalInput.value) || 0.5;
            const intervalMs = intervalSeconds * 1000;
            const elapsed = now - lastCheckTime;
            let progress = Math.min(100, (elapsed / intervalMs) * 100);
            if(intervalMs <= 0) progress = 100;
            countdownBar.style.width = `${progress}%`;
            
            if (elapsed >= intervalMs && pendingGroupChecks.length === 0) {
                lastCheckTime = now;
                const valid = groups.filter(g => g.mainSlot && g.subSlots.filter(s=>s).length >= 3);
                if(valid.length > 0) {
                    pendingGroupChecks = [...valid];
                    lastScanTime = 0; 
                }
            }

            if (pendingGroupChecks.length > 0) {
                if (now - lastScanTime >= SCAN_DELAY) {
                    const group = pendingGroupChecks.shift();
                    processGroup(group);
                    lastScanTime = now;
                }
                nextCheckText.innerText = `掃描序列執行中... 剩餘 ${pendingGroupChecks.length}`;
                nextCheckText.className = "text-[10px] text-right text-yellow-400 font-mono font-bold animate-pulse";
            } else {
                const remainingSeconds = Math.max(0, intervalSeconds - (elapsed / 1000));
                if (remainingSeconds > 0.1) {
                      nextCheckText.innerText = `等待倒數: ${remainingSeconds.toFixed(1)}s (待機中)`;
                      nextCheckText.className = "text-[10px] text-right text-slate-500 font-mono";
                } else {
                      nextCheckText.innerText = `偵測執行中...`;
                      nextCheckText.className = "text-[10px] text-right text-green-400 font-mono font-bold";
                }
            }
            animationFrameId = requestAnimationFrame(detectMotion);
        }
        
        function processGroup(group) {
            const statusEl = document.getElementById(`status-${group.id}`);
            const mainCheckEl = document.getElementById(`check-${group.id}-main`);
            const mainScoreEl = document.getElementById(`score-${group.id}-main`);
            
            if (!showBoxesToggle.checked) {
                clearGroupBoxes(group.id);
            }

            const filledSubSlots = group.subSlots.filter(s => s !== null).length;
            if (!group.mainSlot || filledSubSlots < 3) {
                if(statusEl) {
                    if (!group.mainSlot) { statusEl.innerText = "等待設定大圖"; } 
                    else { statusEl.innerText = `等待設定小圖 (${filledSubSlots}/3)`; }
                    statusEl.className = "text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-400 font-mono";
                }
                if(mainCheckEl) mainCheckEl.classList.add('hidden');
                group.subSlots.forEach((_, idx) => {
                    const el = document.getElementById(`check-${group.id}-sub-${idx}`);
                    if(el) el.classList.add('hidden');
                });
                return; 
            }

            if (canvas.width !== videoNativeWidth || canvas.height !== videoNativeHeight) {
                canvas.width = videoNativeWidth;
                canvas.height = videoNativeHeight;
            }
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            const currentFrameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const sensitivity = parseInt(sensitivityInput.value);
            if (!group.mainSlot.imageData) return;
            
            let mainResult;
            
            // Determine regions to scan based on group.assignedRegion
            let targetRegions = [];
            if (group.assignedRegion === 'fullscreen') {
                 targetRegions = []; // Empty means fallback to full screen search in logic below
            } else if (group.assignedRegion && group.assignedRegion !== 'all') {
                 const rIdx = parseInt(group.assignedRegion);
                 if (scanRegions[rIdx]) {
                     targetRegions = [scanRegions[rIdx]];
                 } else {
                     // Fallback if index invalid
                     targetRegions = scanRegions.length > 0 ? scanRegions : [];
                 }
            } else {
                 // 'all' or undefined
                 targetRegions = scanRegions;
            }

            if (targetRegions.length > 0) {
                 let bestScore = -1;
                 let bestMatch = { score: 0, x: 0, y: 0 };
                 
                 for (const region of targetRegions) {
                     const res = findBestMatchInROI(
                         group.mainSlot.imageData, 
                         currentFrameData, 
                         canvas.width, 
                         canvas.height, 
                         region.x, region.y, region.w, region.h
                     );
                     if (res.score > bestScore) {
                         bestScore = res.score;
                         bestMatch = res;
                     }
                 }
                 mainResult = bestMatch;
            } else {
                 // Full screen scan
                 mainResult = findBestMatchInROI(
                     group.mainSlot.imageData, 
                     currentFrameData, 
                     canvas.width, 
                     canvas.height,
                     0, 0, canvas.width, canvas.height
                 );
            }

            // Apply Correction
            const mainCorrection = group.mainSlot.weightCorrection || 0;
            const finalMainScore = mainResult.score - mainCorrection;
            const isMainMatch = finalMainScore >= sensitivity;
            
            group.lastScores = group.lastScores || {};
            group.lastScores['main'] = finalMainScore; // Show effective score
            if(mainScoreEl) mainScoreEl.innerText = `${Math.max(0, finalMainScore)}%`;

            // NEW V4.2: Store detection coordinates for immediate toggle
            if (isMainMatch) {
                group.latestRects = group.latestRects || { subs: [] };
                group.latestRects.main = { x: mainResult.x, y: mainResult.y, w: group.mainSlot.width, h: group.mainSlot.height };
            } else {
                group.latestRects = null;
            }

            if (!isMainMatch) {
                if(mainCheckEl) mainCheckEl.classList.add('hidden');
                if(statusEl) {
                    statusEl.innerText = "搜尋定位點...";
                    statusEl.className = "text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-400 font-mono";
                }
                
                clearGroupBoxes(group.id);

                group.subSlots.forEach((_, idx) => {
                    const el = document.getElementById(`check-${group.id}-sub-${idx}`);
                    if(el) el.classList.add('hidden');
                });

                if (group.triggerState) {
                    group.triggerState = false;
                    const lostDuration = Date.now() - group.lastChangeTime;
                    group.lastChangeTime = Date.now();
                    const lostMsg = group.lostMessage || "已消失";
                    addLogEntryToState(lostMsg, `共出現 ${formatDuration(lostDuration)}`, 'lost', group.id);
                    playAlertSound('lost');
                    
                    // V4.9 Optimized:
                    updateCardStatus(group);
                    updateHudStatus(group);
                }
                return;
            }

            // Main Found
            if(mainCheckEl) mainCheckEl.classList.remove('hidden');
            clearGroupBoxes(group.id); 
            // Pass 'main', 0
            showGroupDetectionBox(group.id, mainResult.x, mainResult.y, group.mainSlot.width, group.mainSlot.height, 'main', 0);

            const roiX = mainResult.x;
            const roiY = mainResult.y;
            const roiW = group.mainSlot.width;
            const roiH = group.mainSlot.height;
            let subMatches = 0;
            let activeSubCount = 3; 

            group.subSlots.forEach((subSlot, idx) => {
                const subCheckEl = document.getElementById(`check-${group.id}-sub-${idx}`);
                const subScoreEl = document.getElementById(`score-${group.id}-sub-${idx}`);
                if (!subSlot) {
                    if(subCheckEl) subCheckEl.classList.add('hidden');
                    return;
                }
                if (!subSlot.imageData) return;

                const subResult = findBestMatchInROI(subSlot.imageData, currentFrameData, canvas.width, canvas.height, roiX, roiY, roiW, roiH);
                
                // Apply Correction
                const subCorrection = subSlot.weightCorrection || 0;
                const finalSubScore = subResult.score - subCorrection;
                const isSubMatch = finalSubScore >= sensitivity;
                
                group.lastScores[`sub-${idx}`] = finalSubScore;
                if(subScoreEl) subScoreEl.innerText = `${Math.max(0, finalSubScore)}%`;

                if (isSubMatch) {
                    subMatches++;
                    if(subCheckEl) subCheckEl.classList.remove('hidden');
                    // Pass 'sub', idx
                    showGroupDetectionBox(group.id, subResult.x, subResult.y, subSlot.width, subSlot.height, 'sub', idx);
                    
                    // V4.2 Cache sub rect
                    group.latestRects.subs[idx] = { x: subResult.x, y: subResult.y, w: subSlot.width, h: subSlot.height };
                } else {
                    if(subCheckEl) subCheckEl.classList.add('hidden');
                    group.latestRects.subs[idx] = null;
                }
            });

            // Final Logic - STRICT MATCHING
            let isSuccess = (subMatches === 3);

            if (isSuccess) {
                if (!group.triggerState) {
                    group.triggerState = true;
                    const foundDuration = Date.now() - group.lastChangeTime;
                    group.lastChangeTime = Date.now();
                    if(statusEl) {
                        statusEl.innerText = "🟢 驗證成功";
                        statusEl.className = "text-[10px] bg-green-900/50 text-green-400 px-2 py-0.5 rounded font-bold border border-green-500";
                    }
                    
                    // V4.9 Optimized:
                    updateCardStatus(group);
                    
                    const msg = group.successMessage || `偵測成功`;
                    addLogEntryToState(msg, `已消失 ${formatDuration(foundDuration)}`, 'found', group.id);
                    playAlertSound('found');
                    triggerFlash();
                    
                    // V4.9 Optimized:
                    updateHudStatus(group);
                }
            } else {
                 if (!group.triggerState) {
                    if(statusEl) {
                        statusEl.innerText = `比對中 (${subMatches}/${activeSubCount})`;
                        statusEl.className = "text-[10px] bg-slate-800 px-2 py-0.5 rounded text-yellow-500 font-mono animate-pulse";
                    }
                } else {
                    group.triggerState = false;
                    const lostDuration = Date.now() - group.lastChangeTime;
                    group.lastChangeTime = Date.now();
                    const lostMsg = group.lostMessage || "已消失";
                    addLogEntryToState(lostMsg, `共出現 ${formatDuration(lostDuration)}`, 'lost', group.id);
                    playAlertSound('lost');
                    
                    // V4.9 Optimized:
                    updateCardStatus(group);
                    updateHudStatus(group);
                }
            }
        }

        // ROI Constrained Search (Step 2)
        function findBestMatchInROI(targetData, screenData, sWidth, sHeight, roiX, roiY, roiW, roiH) {
            const tWidth = targetData.width;
            const tHeight = targetData.height;
            const tData = targetData.data;
            const sData = screenData.data;
            let minDiff = Infinity;
            let bestX = roiX;
            let bestY = roiY;
            
            // Dynamic Scan Step (V6.1 Optimization)
            let currentStep = SCAN_STEP;
            const area = (roiW || sWidth) * (roiH || sHeight);
            if (area > 500000) { // If scanning large area (> 800x600 approx)
                currentStep = Math.max(SCAN_STEP, 4); // Force higher step to prevent lag
            }

            const startY = Math.max(0, roiY);
            const startX = Math.max(0, roiX);
            const endY = Math.min(sHeight - tHeight, roiY + roiH - tHeight);
            const endX = Math.min(sWidth - tWidth, roiX + roiW - tWidth);

            if (endX < startX || endY < startY) return { score: 0, x: 0, y: 0 };

            for (let y = startY; y <= endY; y += currentStep) {
                for (let x = startX; x <= endX; x += currentStep) {
                    let currentDiff = 0;
                    for (let ty = 0; ty < tHeight; ty+=2) { 
                        for (let tx = 0; tx < tWidth; tx+=2) {
                            const tIndex = (ty * tWidth + tx) * 4;
                            const sIndex = ((y + ty) * sWidth + (x + tx)) * 4;
                            const dr = Math.abs(tData[tIndex] - sData[sIndex]);
                            const dg = Math.abs(tData[tIndex+1] - sData[sIndex+1]);
                            const db = Math.abs(tData[tIndex+2] - sData[sIndex+2]);
                            currentDiff += (dr > PIXEL_TOLERANCE ? dr : 0);
                            currentDiff += (dg > PIXEL_TOLERANCE ? dg : 0);
                            currentDiff += (db > PIXEL_TOLERANCE ? db : 0);
                            if (currentDiff > minDiff) break;
                        }
                        if (currentDiff > minDiff) break;
                    }
                    if (currentDiff < minDiff) {
                        minDiff = currentDiff;
                        bestX = x;
                        bestY = y;
                    }
                }
            }
            const pixelsChecked = (tWidth/2) * (tHeight/2); 
            const maxDiff = pixelsChecked * (255 * 3);
            let similarity = 100 * (1 - (minDiff / maxDiff));
            return { score: Math.max(0, Math.min(100, Math.floor(similarity))), x: bestX, y: bestY };
        }

        async function startCapture() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    videoNativeWidth = videoElement.videoWidth;
                    videoNativeHeight = videoElement.videoHeight;
                    baseHeight = 450;
                    baseWidth = baseHeight * (videoNativeWidth / videoNativeHeight);
                    updateZoom(1);
                    videoElement.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    
                    // V6.4 Fix: DO NOT HIDE sourceControls (which contains scanBtn)
                    startBtn.classList.add('hidden'); // Hide Blue Start
                    scanBtn.classList.remove('hidden'); // Show Green Scan
                    
                    // Show controls immediately (V6.5)
                    activeControls.classList.remove('hidden'); 
                    
                    nextCheckText.innerText = "已連接，可調整範圍，準備好後請按上方綠色按鈕";
                    nextCheckText.className = "text-[10px] text-right text-slate-400 font-mono";
                };
                
            } catch (err) {
                showError("無法啟動監控: " + err.message);
            }
        }
        
        // V6.2 New Function
        function startScanning() {
             isMonitoring = true;
             detectMotion();
             startUiTimer();
             
             // Now swap the control panels to show stop button
             sourceControls.classList.add('hidden');
             // activeControls is already visible from startCapture
        }

        function stopCapture() {
            isMonitoring = false;
            cancelAnimationFrame(animationFrameId);
            if (stream) stream.getTracks().forEach(track => track.stop());
            videoElement.srcObject = null;
            videoElement.classList.add('hidden');
            placeholder.classList.remove('hidden');
            detectionOverlays.innerHTML = '';
            
            // Reset UI
            sourceControls.classList.remove('hidden');
            activeControls.classList.add('hidden');
            
            // Reset Buttons
            startBtn.classList.remove('hidden');
            scanBtn.classList.add('hidden');
            nextCheckText.innerText = "等待開始...";
        }

        function updateZoom(newScale) {
            scale = parseFloat(newScale);
            scale = Math.min(Math.max(1, scale), 50);
            zoomDisplay.innerText = `${scale.toFixed(1)}x`;
            const scrollContainer = previewScroller;
            const content = zoomWrapper;
            const viewportCenterX = scrollContainer.clientWidth / 2;
            const viewportCenterY = scrollContainer.clientHeight / 2;
            const contentCenterX = scrollContainer.scrollLeft + viewportCenterX;
            const contentCenterY = scrollContainer.scrollTop + viewportCenterY;
            const ratioX = contentCenterX / content.offsetWidth;
            const ratioY = contentCenterY / content.offsetHeight;
            if(baseWidth > 0 && baseHeight > 0) {
                zoomWrapper.style.width = `${baseWidth * scale}px`;
                zoomWrapper.style.height = `${baseHeight * scale}px`;
            } else {
                zoomWrapper.style.width = `${scale * 100}%`;
                zoomWrapper.style.height = `${scale * 100}%`;
            }
            const newScrollLeft = (ratioX * content.offsetWidth) - viewportCenterX;
            const newScrollTop = (ratioY * content.offsetHeight) - viewportCenterY;
            scrollContainer.scrollLeft = newScrollLeft;
            scrollContainer.scrollTop = newScrollTop;
        }

        // Attach listeners for auto-save on settings change
        safeAddEventListener(sensitivityInput, 'change', saveData);
        safeAddEventListener(checkIntervalInput, 'change', saveData);
        safeAddEventListener(soundToggle, 'change', saveData);

        safeAddEventListener(startBtn, 'click', startCapture);
        safeAddEventListener(scanBtn, 'click', startScanning); // Added listener
        safeAddEventListener(stopBtn, 'click', stopCapture);
        
        safeAddEventListener(sensitivityInput, 'input', (e) => sensitivityVal.innerText = `${e.target.value}%`);
        
        safeAddEventListener(zoomInBtn, 'click', () => updateZoom(scale + 0.5));
        safeAddEventListener(zoomOutBtn, 'click', () => updateZoom(scale - 0.5));
        safeAddEventListener(zoomResetBtn, 'click', () => updateZoom(1));

        // Initial Load
        loadData();
    </script>
</body>
</html>
