# Detector
動態變動偵測器<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動態變動偵測器 v6.9 (跨日修復版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            user-select: none;
            overflow-y: auto; /* Ensure body can scroll */
        }
        /* 標準卷軸樣式 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .flash-border { animation: flashBorder 3s ease-out forwards; }
        @keyframes flashBorder {
            0% { border-color: rgba(34, 197, 94, 0); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
            10% { border-color: rgba(34, 197, 94, 1); box-shadow: 0 0 20px 0 rgba(34, 197, 94, 0.5) inset; }
            80% { border-color: rgba(34, 197, 94, 1); box-shadow: 0 0 10px 0 rgba(34, 197, 94, 0.3) inset; }
            100% { border-color: rgba(34, 197, 94, 0); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* 偵測綠框樣式 */
        .detection-box {
            position: absolute;
            border: 1px solid #22c55e;
            background-color: rgba(34, 197, 94, 0.1);
            box-shadow: 0 0 0 1px rgba(0,0,0,0.1), 0 0 4px rgba(34, 197, 94, 0.4);
            pointer-events: none;
            z-index: 40;
            transition: all 0.1s linear;
        }
        .detection-box.main-anchor {
            border-color: #3b82f6; 
            background-color: rgba(59, 130, 246, 0.05);
            border-style: dashed;
        }

        /* 誤判修正按鈕 (X) - 極致微型版 v6.9 (10px) */
        .detection-close-btn {
            position: absolute;
            top: -5px; right: -5px; 
            width: 10px; height: 10px; /* 12px -> 10px */
            background-color: #ef4444; color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 6px; /* 8px -> 6px */
            cursor: pointer; pointer-events: auto; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.5); z-index: 50;
            transition: transform 0.1s, background-color 0.2s;
            border: 1px solid #0f172a; 
        }
        .detection-close-btn:hover { transform: scale(1.3); background-color: #dc2626; }
        .detection-close-btn:active { transform: scale(0.95); }

        .scan-region-box {
            position: absolute; border: 2px dashed rgba(255, 255, 255, 0.5);
            background-color: rgba(255, 255, 255, 0.05); pointer-events: none; z-index: 35;
        }
        .scan-region-label {
            position: absolute; top: -16px; left: 0;
            background: rgba(255, 255, 255, 0.5); color: #000;
            font-size: 10px; padding: 0 4px; font-weight: bold;
        }
        
        .preview-wrapper {
            position: relative; 
            background-color: #000; 
            border-radius: 0.75rem; 
            overflow: hidden; 
            height: 500px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .preview-scroller { overflow: auto; width: 100%; height: 100%; display: block; }
        .crop-selection {
            position: absolute; border: 2px dashed #facc15;
            background-color: rgba(250, 204, 21, 0.2); pointer-events: none;
            z-index: 50; display: none;
        }
        .crosshair-cursor { cursor: crosshair !important; }
        #imgViewModalContent { max-height: 85vh; max-width: 95vw; width: auto; height: auto; min-width: 300px; }

        .combo-slot {
            background-color: #1e293b; border: 2px dashed #475569;
            border-radius: 0.5rem; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; overflow: hidden; position: relative;
        }
        .combo-slot.hover { border-color: #facc15; background-color: #334155; }
        .combo-slot.filled { border-style: solid; border-color: #475569; }
        
        .slot-main { width: 100%; height: 80px; margin-bottom: 8px; border-color: #3b82f6; border-style: dashed; }
        .slot-main.filled { border-style: solid; }
        .slot-sub { width: 60px; height: 60px; }

        .combo-slot.matched { border-color: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }
        .slot-main.matched { border-color: #3b82f6; box-shadow: 0 0 8px rgba(59, 130, 246, 0.5); }
        
        .slot-label {
            position: absolute; bottom: 2px; right: 2px; font-size: 9px;
            background: rgba(0,0,0,0.7); color: #ccc; padding: 1px 4px;
            border-radius: 4px; pointer-events: none;
        }
        .score-tag {
            position: absolute; top: 0; left: 0; background-color: rgba(0, 0, 0, 0.7);
            color: #fff; font-size: 10px; padding: 1px 4px;
            border-bottom-right-radius: 4px; font-family: monospace; z-index: 10;
        }
        .log-subtext { font-size: 10px; color: #64748b; margin-left: 18px; }
        #logContainer { scrollbar-width: thin; scrollbar-color: #475569 #1e293b; }
        
        #loadingOverlay { backdrop-filter: blur(4px); }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1); width: 36px; height: 36px;
            border-radius: 50%; border-left-color: #3b82f6; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .draggable-source { opacity: 0.4; border: 2px dashed #64748b; }
        .drag-handle { cursor: move; }
        .hud-draggable-source { opacity: 0.5; transform: scale(0.95); }
        
        .lights-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 150px; opacity: 1; overflow-y: auto;
        }
        .lights-content.collapsed { max-height: 0; opacity: 0; margin: 0; padding: 0; }
        .chevron { transition: transform 0.3s; }
        .chevron.collapsed { transform: rotate(-90deg); }

        /* FIXED: Group List Content - Enabled Scrolling */
        .group-list-content {
            transition: max-height 0.3s ease-in-out;
            max-height: 60vh; /* Restrict height to view */
            overflow-y: auto; /* Enable scrollbar */
            overflow-x: hidden;
        }
        .group-list-content.collapsed {
            max-height: 0 !important;
            overflow: hidden;
        }
        
        /* LOG CONTENT COLLAPSE STYLE */
        .log-content-wrapper { transition: height 0.3s ease-in-out; height: 340px; overflow: hidden; }
        .log-content-wrapper.collapsed { height: 0 !important; }

        .edit-controls { display: none; }
        .is-edit-mode .edit-controls { display: flex; }

        .pagination-container { display: flex; gap: 4px; align-items: center; justify-content: center; padding: 4px 0; }
        .page-btn {
            background: transparent; color: #64748b; border: 1px solid #334155;
            min-width: 24px; height: 24px; font-size: 11px; padding: 0 4px;
            border-radius: 4px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-family: monospace; transition: all 0.1s;
        }
        .page-btn:hover { color: #e2e8f0; border-color: #475569; background-color: #1e293b; }
        .page-btn.active { background-color: #2563eb; color: #fff; border-color: #2563eb; font-weight: bold; }
        .dots { color: #475569; font-size: 10px; padding: 0 2px; }

        /* Highlight the Popout Button */
        #popoutLogBtn {
            animation: pulse-blue 2s infinite;
            border: 1px solid #3b82f6;
        }
        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/70 z-[100] flex flex-col items-center justify-center">
        <div class="spinner mb-4"></div>
        <div id="loadingText" class="text-white font-bold text-lg tracking-wide">處理中...</div>
    </div>

    <!-- Header -->
    <header class="w-full max-w-5xl mb-2 flex flex-col md:flex-row justify-between items-center mt-1 gap-2 z-10 relative">
        <div class="flex-shrink-0 flex items-baseline">
            <h1 class="text-2xl md:text-3xl font-bold text-teal-400 flex items-center">
                <i class="fas fa-crosshairs mr-2"></i>錨點定位偵測器 
            </h1>
            <span class="ml-2 text-xs font-bold text-slate-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">v6.9</span>
            <span class="text-xs bg-slate-700 text-teal-200 px-2 py-1 rounded ml-2 font-normal self-center">DOM極致優化版</span>
        </div>
        <div class="flex gap-2 flex-wrap justify-center">
            <button id="openDataModalBtn" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs md:text-sm font-bold shadow-lg transition-colors flex items-center gap-2">
                <i class="fas fa-database"></i> 資料備份與還原
            </button>
        </div>
    </header>

    <!-- Error Modal -->
    <div id="errorModal" class="hidden fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-red-500/50 rounded-xl p-6 max-w-md w-full shadow-2xl relative">
            <button id="closeErrorBtn" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fas fa-times"></i>
            </button>
            <div class="text-center">
                <div class="w-16 h-16 bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-exclamation-triangle text-red-500 text-2xl"></i>
                </div>
                <h3 class="text-xl font-bold text-white mb-2">錯誤</h3>
                <p id="errorMessage" class="text-slate-300 text-sm mb-6 leading-relaxed break-words"></p>
                <button onclick="document.getElementById('errorModal').classList.add('hidden')" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="hidden fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-green-500/50 rounded-xl p-6 max-w-md w-full shadow-2xl relative text-center">
            <div class="w-16 h-16 bg-green-900/30 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce-short">
                <i class="fas fa-check text-green-500 text-3xl"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">成功</h3>
            <p id="successMessage" class="text-slate-300 text-sm">操作成功</p>
        </div>
    </div>

    <!-- Data Management Modal -->
    <div id="dataModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-600 rounded-xl max-w-2xl w-full shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50 rounded-t-xl">
                <h3 class="text-xl font-bold text-white"><i class="fas fa-save mr-2 text-indigo-400"></i>資料備份與還原</h3>
                <button id="closeDataModalBtn" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-8 scrollbar-thin">
                <div class="space-y-4">
                    <h4 class="text-lg font-bold text-emerald-400 border-b border-emerald-900/30 pb-2"><i class="fas fa-download mr-2"></i>導出資料 (含日誌)</h4>
                    <div class="grid grid-cols-1 gap-4">
                        <button id="exportFileBtn" class="p-4 bg-slate-700 hover:bg-slate-600 rounded-lg border border-slate-600 group transition-all text-left relative overflow-hidden">
                            <div class="flex items-center justify-between mb-2">
                                <span class="font-bold text-white group-hover:text-emerald-300">下載 HTML 檔案</span>
                                <i class="fas fa-file-code text-2xl text-slate-500 group-hover:text-emerald-400"></i>
                            </div>
                            <p class="text-xs text-slate-400">推薦使用。下載 .html 格式，方便保存與查看。</p>
                        </button>
                    </div>
                </div>
                <div class="space-y-4">
                    <h4 class="text-lg font-bold text-blue-400 border-b border-blue-900/30 pb-2"><i class="fas fa-upload mr-2"></i>匯入資料 (支援 .html/.json)</h4>
                    <div class="p-4 bg-slate-900/50 rounded-lg border border-slate-700">
                        <label class="block text-sm font-bold text-slate-300 mb-2">上傳檔案還原</label>
                        <div class="flex flex-col gap-3">
                            <div class="flex gap-2 items-center">
                                <input type="file" id="modalImportInput" accept=".json,.html,.htm" class="hidden">
                                <button onclick="document.getElementById('modalImportInput').click()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded border border-slate-500 transition-colors flex items-center gap-2">
                                    <i class="fas fa-folder-open"></i> 選擇檔案...
                                </button>
                                <span id="fileNameDisplay" class="text-xs text-slate-500 truncate max-w-[200px]">未選擇檔案</span>
                            </div>
                            <button id="executeFileImportBtn" type="button" class="hidden w-full py-3 bg-green-600 hover:bg-green-500 text-white rounded text-sm font-bold transition-colors animate-fade-in flex items-center justify-center shadow-lg">
                                <i class="fas fa-check mr-2"></i> 開始還原此檔案
                            </button>
                        </div>
                    </div>
                </div>
                <div class="pt-4 border-t border-slate-700">
                     <button id="resetAllBtn" class="w-full py-3 rounded-lg bg-red-900/20 hover:bg-red-900/40 text-red-400 text-sm font-bold border border-red-900/50 transition-colors flex items-center justify-center gap-2">
                        <i class="fas fa-trash-alt"></i> 清除所有資料 (重置)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image View Modal -->
    <div id="imgViewModal" class="hidden fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4" onclick="closeImgModal()">
        <div class="relative bg-slate-800 p-2 rounded-lg shadow-2xl border border-slate-600 flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="closeImgModal()" class="absolute -top-4 -right-4 bg-red-600 hover:bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg border border-white/20 z-50">
                <i class="fas fa-times"></i>
            </button>
            <div class="text-slate-300 text-sm font-bold mb-2 px-1 w-full text-center border-b border-slate-700 pb-2" id="imgModalTitle">目標預覽</div>
            <img id="imgViewModalContent" src="" alt="Zoomed Image" class="rounded object-contain bg-black/50">
        </div>
    </div>

    <!-- Main Content -->
    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Column -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-slate-800 rounded-xl p-6 shadow-lg border border-slate-700">
                <div id="sourceControls" class="mb-6">
                    <button id="startBtn" class="w-full px-6 py-4 bg-teal-600 hover:bg-teal-500 text-white rounded-lg font-bold text-lg transition-colors flex items-center justify-center gap-3 shadow-lg shadow-teal-900/30">
                        <i class="fas fa-camera"></i> 連接 OBS / 攝影機
                    </button>
                    <!-- NEW Scan Button (Initially Hidden) -->
                    <button id="scanBtn" class="hidden w-full px-6 py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold text-lg transition-colors flex items-center justify-center gap-3 shadow-lg shadow-emerald-900/30 animate-pulse">
                        <i class="fas fa-play"></i> 開始掃描監控
                    </button>
                </div>
                <div id="activeControls" class="hidden mb-6">
                    <div class="flex flex-col gap-4">
                        <div class="flex gap-2">
                             <button id="stopBtn" class="px-6 py-3 bg-red-600 hover:bg-red-500 text-white rounded-lg font-bold transition-colors flex items-center justify-center gap-2 shadow-lg shadow-red-900/50 flex-1">
                                <i class="fas fa-stop"></i> 停止
                            </button>
                            <button id="addComboBtn" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-bold transition-colors flex items-center justify-center gap-2 shadow-lg shadow-indigo-900/50 flex-[2]">
                                <i class="fas fa-layer-group"></i> 新增定位組合
                            </button>
                        </div>
                        <div class="bg-slate-700/30 p-3 rounded border border-slate-600 flex justify-between items-center">
                             <div id="scanRegionStatus" class="text-xs text-slate-400 font-mono">
                                 掃描範圍: <span class="text-white font-bold">全螢幕</span>
                             </div>
                             <div class="flex gap-2">
                                 <button id="addScanRegionBtn" class="px-3 py-1.5 bg-slate-600 hover:bg-slate-500 text-white text-xs rounded border border-slate-500 flex items-center gap-1 transition-colors whitespace-nowrap">
                                     <i class="fas fa-plus"></i> 新增範圍
                                 </button>
                                 <button id="clearScanRegionsBtn" class="hidden px-3 py-1.5 bg-red-900/50 hover:bg-red-800 text-red-200 text-xs rounded border border-red-700 flex items-center gap-1 transition-colors whitespace-nowrap">
                                     <i class="fas fa-trash"></i> 清除
                                 </button>
                             </div>
                        </div>
                        <div id="cropInstruction" class="hidden bg-yellow-900/40 text-yellow-200 p-3 text-center text-sm rounded border border-yellow-600/50 animate-pulse font-bold">
                            <i class="fas fa-mouse-pointer mr-2"></i> 請在下方畫面中拖曳，截取圖片...
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-900/40 p-4 rounded-lg border border-slate-700/50">
                    <div class="space-y-2">
                        <div class="flex justify-between text-sm items-center mb-1">
                            <label for="sensitivity" class="text-slate-200 font-bold"><i class="fas fa-sliders-h mr-2 text-teal-500"></i>匹配嚴格度</label>
                            <span id="sensitivityVal" class="text-teal-400 font-mono font-bold bg-slate-800 px-2 py-1 rounded">90%</span>
                        </div>
                        <input type="range" id="sensitivity" min="50" max="100" value="90" class="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-teal-500 hover:bg-slate-500 transition-colors">
                        <div class="flex items-center gap-4 pt-2 flex-wrap">
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="soundToggle" class="sr-only peer" checked>
                                <div class="relative w-9 h-5 bg-slate-600 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-500 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                                <span class="ms-2 text-xs font-medium text-slate-400">啟用音效</span>
                            </label>
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="showBoxesToggle" class="sr-only peer" checked>
                                <div class="relative w-9 h-5 bg-slate-600 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-emerald-500 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-600"></div>
                                <span class="ms-2 text-xs font-medium text-slate-400">顯示綠框</span>
                            </label>
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="showRegionsToggle" class="sr-only peer" checked>
                                <div class="relative w-9 h-5 bg-slate-600 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-indigo-500 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-500"></div>
                                <span class="ms-2 text-xs font-medium text-slate-400">顯示範圍</span>
                            </label>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between text-sm items-center mb-1">
                            <label for="checkInterval" class="text-slate-200 font-bold"><i class="fas fa-clock mr-2 text-blue-500"></i>偵測間隔 (秒)</label>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" id="checkInterval" value="10" min="0.1" step="0.1" class="w-full bg-slate-800 border border-slate-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-1.5 text-center font-mono">
                            <span class="text-xs text-slate-400 whitespace-nowrap">秒/次</span>
                        </div>
                        <div class="relative w-full h-1.5 bg-slate-700 rounded-full overflow-hidden mt-1">
                            <div id="countdownBar" class="absolute top-0 left-0 h-full bg-blue-500 w-0 transition-none"></div>
                        </div>
                        <div class="text-[10px] text-right text-blue-400 font-mono" id="nextCheckText">等待開始...</div>
                    </div>
                </div>
            </div>

            <!-- Video Preview -->
            <div id="previewWrapper" class="preview-wrapper group relative">
                <div id="statusHUD" class="absolute top-0 left-0 w-full p-2 z-50 flex flex-wrap gap-2 pointer-events-none"></div>

        function formatDuration(ms) {
            if (ms < 1000) return "0秒";
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            
            const s = seconds % 60;
            const m = minutes % 60;
            
            let str = "";
            if(hours > 0) str += `${hours}時 `;
            if(minutes > 0) str += `${m}分 `;
            str += `${s}秒`;
            return str.trim();
        }

        function formatTimerDuration(ms) {
            if (ms < 60000) return "1分內"; // < 1 min
            const minutes = Math.floor(ms / 60000);
            const hours = Math.floor(minutes / 60);
            const m = minutes % 60;
            
            if (hours > 0) return `${hours}小時${m}分`;
            return `${m}分`;
        }

        function removeLogEntry(entry) {
            const index = logs.indexOf(entry);

        function exportLogsToExcel() {
            if (logs.length === 0) {
                showError("沒有日誌可導出");
                return;
            }
            let csvContent = "\uFEFF"; 
            csvContent += "日期,時間,類型,訊息,詳細資訊\n"; 
            const filterDateVal = logDateFilter.value;
            const targetLogs = logs.filter(entry => {
                if (!filterDateVal) return true;
                const d = new Date(entry.time);
                const entryDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                return entryDate === filterDateVal;
            });

            if (targetLogs.length === 0) {
                showError("目前篩選條件下沒有資料");
                return;
            }

            targetLogs.forEach(log => {
                const d = new Date(log.time);
                const dateStr = d.toLocaleDateString('zh-TW');
                const timeStr = d.toLocaleTimeString('zh-TW');
                const typeStr = log.type === 'found' ? '出現' : (log.type === 'lost' ? '消失' : '系統');
                const msg = `"${(log.text || '').replace(/"/g, '""')}"`;
                const subMsg = `"${(log.subText || '').replace(/"/g, '""')}"`;
                csvContent += `${dateStr},${timeStr},${typeStr},${msg},${subMsg}\n`; 
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            
            const nowStr = new Date().toISOString().slice(0,10);
            link.setAttribute("href", url);
            link.setAttribute("download", `detector_logs_${nowStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function createLogItemHTML(entry) {
            const date = new Date(entry.time);

            const fullDateStr = date.toLocaleDateString('zh-TW');
            const timeStr = date.toLocaleTimeString('zh-TW', { hour12: true, hour: '2-digit', minute:'2-digit' });
            
            let colorClass = entry.type === 'found' ? 'text-green-400 font-bold' : (entry.type === 'lost' ? 'text-red-400' : 'text-slate-300');
            let icon = entry.type === 'found' ? 'check-circle' : (entry.type === 'lost' ? 'times-circle' : 'info-circle');
            
            const mainMsg = entry.text || '';
            const subMsgHTML = entry.subText ? `<div class="log-subtext">${entry.subText}</div>` : '';

            return `
                <div class="flex justify-between items-start text-slate-300 bg-slate-700/30 px-2 py-1.5 rounded border-l-2 ${entry.type === 'found' ? 'border-green-500' : 'border-slate-500'} animate-fade-in group text-xs mb-1 hover:bg-slate-700/50 transition-colors">

                    </button>

            `;
        }
        
        function generatePaginationHTML(currentPage, totalPages, funcName) {
            let html = '<div class="pagination-container">';
            const createBtn = (p, current) => {
                const activeClass = p === current ? 'active' : '';
                return `<button class="page-btn ${activeClass}" onclick="${funcName}(${p})">${p}</button>`;
            };
            if (totalPages <= 7) {
                for (let i = 1; i <= totalPages; i++) {
                    html += createBtn(i, currentPage);
                }
            } else {
                html += createBtn(1, currentPage);
                if (currentPage > 3) html += '<span class="dots">...</span>';
                let start = Math.max(2, currentPage - 1);
                let end = Math.min(totalPages - 1, currentPage + 1);
                if (currentPage < 4) { end = 4; start = 2; }
                if (currentPage > totalPages - 3) { start = totalPages - 3; end = totalPages - 1; }
                for (let i = start; i <= end; i++) html += createBtn(i, currentPage);
                if (currentPage < totalPages - 2) html += '<span class="dots">...</span>';
                html += createBtn(totalPages, currentPage);
            }
            html += '</div>';
            return html;
        }

        function generatePopoutPaginationHTML(currentPage, totalPages) {
            let html = '<div class="pagination-container">';
            const createBtn = (p, current) => {
                const activeClass = p === current ? 'active' : '';
                // 5.7 FIX: Use multiple fallback methods in onclick
                return `<button class="page-btn ${activeClass}" onclick="tryCall('setPopoutPage', ${p})">${p}</button>`;
            };
            if (totalPages <= 7) {
                for (let i = 1; i <= totalPages; i++) html += createBtn(i, currentPage);
            } else {
                html += createBtn(1, currentPage);
                if (currentPage > 3) html += '<span class="dots">...</span>';
                let start = Math.max(2, currentPage - 1);
                let end = Math.min(totalPages - 1, currentPage + 1);
                if (currentPage < 4) { end = 4; start = 2; }
                if (currentPage > totalPages - 3) { start = totalPages - 3; end = totalPages - 1; }
                for (let i = start; i <= end; i++) html += createBtn(i, currentPage);
                if (currentPage < totalPages - 2) html += '<span class="dots">...</span>';
                html += createBtn(totalPages, currentPage);
            }
            html += '</div>';
            return html;
        }

        function generateLogHtml(filteredLogs) {
            const totalPages = Math.ceil(filteredLogs.length / popoutItemsPerPage);
            if (popoutCurrentPage > totalPages) popoutCurrentPage = Math.max(1, totalPages);
            const startIdx = (popoutCurrentPage - 1) * popoutItemsPerPage;
            const endIdx = startIdx + popoutItemsPerPage;
            const pageLogs = filteredLogs.slice(startIdx, endIdx);
            if (pageLogs.length === 0 && filteredLogs.length > 0) {
                popoutCurrentPage = Math.max(1, popoutCurrentPage - 1);
                const newStart = (popoutCurrentPage - 1) * popoutItemsPerPage;
                const newPageLogs = filteredLogs.slice(newStart, newStart + popoutItemsPerPage);
                return generateLogHtmlContent(newPageLogs);
            }
            if (filteredLogs.length === 0) return '<div style="text-align:center; color: #64748b; margin-top: 20px;">無符合紀錄</div>';
            return generateLogHtmlContent(pageLogs);
        }

        function generateLogHtmlContent(logs) {

        function prepareDataForSave(fullGroups) {
             return fullGroups.map(g => {
                const newG = { ...g };
                newG.triggerState = false;
                if (newG.mainSlot) {
                    const { imageData, ...rest } = newG.mainSlot;
                    newG.mainSlot = rest; 
                }
                newG.subSlots = newG.subSlots.map(s => {
                    if (!s) return null;
                    const { imageData, ...rest } = s;
                    return rest;
                });
                return newG;
            });
        }

        function saveData() {
            if (!isLoaded) return; // Prevent overwriting if not loaded
            try {
                const groupsToSave = prepareDataForSave(groups);
                const data = {
                    groups: groupsToSave,
                    logs: logs, 
                    nextGroupId,
                    categoryOrder, 
                    scanRegions, 
                    sensitivity: sensitivityInput.value,
                    checkInterval: checkIntervalInput.value,
                    scanStep: SCAN_STEP,
                    soundEnabled: soundToggle.checked,
                    showBoxes: showBoxesToggle.checked,
                    showRegions: showRegionsToggle.checked
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.error("Save failed (Quota exceeded?):", e);
            }
        }
        
        async function restoreImageDataFromUrl(url, width, height) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const timeout = setTimeout(() => reject(new Error("圖片載入超時")), 5000); 
                img.onload = () => {
                    clearTimeout(timeout);
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = width;
                    tempCanvas.height = height;
                    const tCtx = tempCanvas.getContext('2d');
                    tCtx.drawImage(img, 0, 0);
                    try {
                        const imageData = tCtx.getImageData(0, 0, width, height);
                        resolve(imageData);
                    } catch (e) {
                        reject(e);
                    }
                };
                img.onerror = (e) => {
                    clearTimeout(timeout);
                    reject(new Error("圖片載入失敗"));
                };
                img.src = url;
            });
        }

        async function restoreGroups(dataGroups) {
            const restoredGroups = dataGroups;
            for (let group of restoredGroups) {
                if (!group.lastChangeTime) group.lastChangeTime = Date.now();
                if (!group.lastScores) group.lastScores = {};
                if (!group.category) group.category = "預設群組";
                if (!group.assignedRegion) group.assignedRegion = 'all';

                if (group.mainSlot && group.mainSlot.displayUrl) {
                    try {
                        group.mainSlot.imageData = await restoreImageDataFromUrl(
                            group.mainSlot.displayUrl, 
                            group.mainSlot.width, 
                            group.mainSlot.height
                        );
                    } catch (e) {
                        console.warn("Failed to restore main image", e);
                        group.mainSlot = null;
                    }
                }
                for (let i = 0; i < group.subSlots.length; i++) {
                    const slot = group.subSlots[i];
                    if (slot && slot.displayUrl) {
                        try {
                            slot.imageData = await restoreImageDataFromUrl(
                                slot.displayUrl,
                                slot.width,
                                slot.height
                            );
                        } catch (e) {
                            console.warn("Failed to restore sub image", e);
                            group.subSlots[i] = null;
                        }
                    }
                }
            }
            return restoredGroups;
        }

        async function loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
                isLoaded = true; // No data, but considered loaded empty
                return;
            }
            try {
                const data = JSON.parse(raw);
                await applyLoadedData(data, false);
            } catch (e) {
                console.error("Load failed:", e);
                showError("自動讀取暫存資料失敗，請嘗試清除資料。");
            } finally {
                isLoaded = true;
            }
        }

        async function applyLoadedData(data, showSuccessMsg = true) {
            if (data.sensitivity) {
                sensitivityInput.value = data.sensitivity;
                sensitivityVal.innerText = `${data.sensitivity}%`;
            }
            if (data.checkInterval) checkIntervalInput.value = data.checkInterval;
            if (data.scanStep) {
                SCAN_STEP = data.scanStep;
            }
            if (data.soundEnabled !== undefined) soundToggle.checked = data.soundEnabled;
            if (data.showBoxes !== undefined) showBoxesToggle.checked = data.showBoxes;
            if (data.showRegions !== undefined) showRegionsToggle.checked = data.showRegions; 
            
            if (data.nextGroupId) nextGroupId = data.nextGroupId;
            if (data.categoryOrder) categoryOrder = data.categoryOrder;
            if (data.scanRegions) scanRegions = data.scanRegions;
            
            renderScanRegions();
            updateScanRegionStatus();
            
            if (data.logs && Array.isArray(data.logs)) {
                logs = data.logs;
                renderAllLogs();
            }

            if (data.groups && Array.isArray(data.groups)) {
                groups = await restoreGroups(data.groups);
                renderGroups();
                renderStatusHUD(); 
                startUiTimer();
            }
            
            if(showSuccessMsg) {
                showSuccess("資料還原成功");
                dataModal.classList.add('hidden');
            }

        async function processImportData(data) {
            if (!data.groups && !Array.isArray(data.groups)) {
                throw new Error("無效的資料格式 (缺 group 資料)");
            }
            await applyLoadedData(data, true);
            saveData(); 
        }

        function extractDataFromHtml(content) {
            if (content.trim().startsWith('{')) {
                try { return JSON.parse(content); } catch(e) {}
            }
            const openTag = '<script id="motion-data" type="application/json">';
            const closeTag = '<' + '/script>';
            const startIndex = content.indexOf(openTag);
            if (startIndex !== -1) {
                const dataStart = startIndex + openTag.length;
                const endIndex = content.lastIndexOf(closeTag);
                if (endIndex > dataStart) {
                    const jsonStr = content.substring(dataStart, endIndex);
                    try {
                        return JSON.parse(jsonStr);
                    } catch (e) {
                        throw new Error("JSON 解析失敗: " + e.message);
                    }
                }
            }
            throw new Error("無法辨識資料格式 (找不到有效的 JSON 或 Script 標籤)");
        }

                    const content = event.target.result;
                    let data;
                    if (selectedImportFile.name.endsWith('.json')) {
                        data = JSON.parse(content);
                    } else {
                        data = extractDataFromHtml(content);

        function playAlertSound(type = 'found') {
            if (!soundToggle.checked) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                if (type === 'found') {
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); 
                } else {
                    oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.2); 
                }
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.2);
            } catch(e) {
                console.warn("Audio play failed");
            }
        }

        function triggerFlash() {
            flashOverlay.classList.remove('flash-border');
            void flashOverlay.offsetWidth; 
            flashOverlay.classList.add('flash-border');
            if (flashTimeoutId) clearTimeout(flashTimeoutId);
            flashTimeoutId = setTimeout(() => {
                flashOverlay.classList.remove('flash-border');
            }, 3000); 
        }

        function showDetectionBox(x, y, w, h, isMain = false) {
            if (!showBoxesToggle.checked) return;
            if (!videoElement.videoWidth || !videoElement.videoHeight) return;
            const perX = (x / videoElement.videoWidth) * 100;
            const perY = (y / videoElement.videoHeight) * 100;
            const perW = (w / videoElement.videoWidth) * 100;
            const perH = (h / videoElement.videoHeight) * 100;
            const box = document.createElement('div');
            box.className = 'detection-box';
            if (isMain) box.classList.add('main-anchor');
            box.style.left = `${perX}%`;
            box.style.top = `${perY}%`;
            box.style.width = `${perW}%`;
            box.style.height = `${perH}%`;
            detectionOverlays.appendChild(box);
        }
        
        function clearGroupBoxes(groupId) {
            const existing = document.querySelectorAll(`.detection-box[data-group-id="${groupId}"]`);
            existing.forEach(el => el.remove());
        }

        function handleFalsePositive(groupId, slotType, slotIndex, element) {
            const group = groups.find(g => g.id === groupId);
            if (!group) return;

            let targetSlot = null;
            if (slotType === 'main') {
                targetSlot = group.mainSlot;
            } else {
                targetSlot = group.subSlots[slotIndex];
            }

            if (targetSlot) {
                targetSlot.weightCorrection = (targetSlot.weightCorrection || 0) + 3;
                saveData();
                showSuccess("誤判修正：已扣除 3% 權重");
                
                // V4.3.1 CHANGE: Only remove the specific clicked box element
                if(element) element.remove();
            }
        }

        function showGroupDetectionBox(groupId, x, y, w, h, slotType, slotIndex) {
            if (!showBoxesToggle.checked) return;
            if (!videoElement.videoWidth) return;
            const perX = (x / videoElement.videoWidth) * 100;
            const perY = (y / videoElement.videoHeight) * 100;
            const perW = (w / videoElement.videoWidth) * 100;
            const perH = (h / videoElement.videoHeight) * 100;
            const box = document.createElement('div');
            box.className = 'detection-box';
            box.setAttribute('data-group-id', groupId);
            if (slotType === 'main') box.classList.add('main-anchor');
            box.style.left = `${perX}%`;
            box.style.top = `${perY}%`;
            box.style.width = `${perW}%`;
            box.style.height = `${perH}%`;
            
            // Create Close Button
            const closeBtn = document.createElement('div');
            closeBtn.className = 'detection-close-btn';
            closeBtn.innerHTML = '<i class="fas fa-times"></i>';
            closeBtn.title = "標記為誤判 (扣除 3% 權重)";
            
            // V4.3.1: Pass 'box' (the DOM element) to handleFalsePositive
            closeBtn.onclick = (e) => {
                e.stopPropagation();
                handleFalsePositive(groupId, slotType, slotIndex, box);
            };
            box.appendChild(closeBtn);

            detectionOverlays.appendChild(box);
        }

        // --- Group Management & Drag n Drop ---

        function getNextAvailableId() {
            const existingIds = groups.map(g => g.id);
            let id = 1;
            while (existingIds.includes(id)) { id++; }
            return id;
        }

        function updateGroupScanRegion(id, regionVal) {
             const group = groups.find(g => g.id === id);
             if (group) {
                 group.assignedRegion = regionVal;
                 saveData();
             }
        }

        // --- HUD Drag & Drop Logic ---
        let hudDragSrcEl = null;

        function handleHudDragStart(e) {
            hudDragSrcEl = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('type', 'hud-category'); 
            e.dataTransfer.setData('text/plain', this.dataset.cat);
            this.classList.add('hud-draggable-source');
        }

        function handleHudDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            return false;
        }

        function handleHudDragEnter(e) {
            this.classList.add('opacity-50');
        }

        function handleHudDragLeave(e) {
            this.classList.remove('opacity-50');
        }

        function handleHudDrop(e) {
            if (e.stopPropagation) e.stopPropagation();
            
            const dragType = e.dataTransfer.getData('type');
            if (dragType !== 'hud-category') return false; 

            const sourceCat = e.dataTransfer.getData('text/plain');
            const targetCat = this.dataset.cat;

            if (sourceCat !== targetCat) {
                const srcIdx = categoryOrder.indexOf(sourceCat);
                const tgtIdx = categoryOrder.indexOf(targetCat);
                
                if (srcIdx > -1 && tgtIdx > -1) {
                    categoryOrder.splice(srcIdx, 1);
                    categoryOrder.splice(tgtIdx, 0, sourceCat);
                    saveData();
                    renderStatusHUD();
                }
            }
            this.classList.remove('opacity-50');
            return false;
        }

        function handleHudDragEnd(e) {
            if(hudDragSrcEl) hudDragSrcEl.classList.remove('hud-draggable-source');
            const items = document.querySelectorAll('.hud-category-wrapper');
            items.forEach(item => item.classList.remove('opacity-50'));
        }

        // --- Status Lights HUD Grouping Logic ---
        function renderStatusHUD(forcePopout = false) {
            const grouped = {};
            const presentCategories = new Set();
            
            groups.forEach(g => {
                const cat = g.category || "預設群組";
                if(!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(g);
                presentCategories.add(cat);
            });

            presentCategories.forEach(cat => {
                if (!categoryOrder.includes(cat)) {
                    categoryOrder.push(cat);
                }
            });
            const renderKeys = categoryOrder.filter(cat => presentCategories.has(cat));

            // 1. Render for Main Window
            if (logStatusLights) {
                logStatusLights.innerHTML = '';
                renderKeys.forEach(cat => {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = "hud-category-wrapper flex flex-col gap-1 mr-4 mb-2 min-w-[80px] cursor-move transition-all";
                    groupDiv.draggable = true;
                    groupDiv.dataset.cat = cat;
                    
                    groupDiv.addEventListener('dragstart', handleHudDragStart);
                    groupDiv.addEventListener('dragover', handleHudDragOver);
                    groupDiv.addEventListener('dragenter', handleHudDragEnter);
                    groupDiv.addEventListener('dragleave', handleHudDragLeave);
                    groupDiv.addEventListener('drop', handleHudDrop);
                    groupDiv.addEventListener('dragend', handleHudDragEnd);
                    
                    const title = document.createElement('div');
                    title.className = "text-[9px] text-indigo-300 font-bold pb-0.5 mb-1 select-none"; 
                    title.innerText = cat;
                    groupDiv.appendChild(title);
                    
                    const lightsRow = document.createElement('div');
                    lightsRow.className = "flex flex-wrap gap-1";
                    grouped[cat].forEach(g => {
                        lightsRow.appendChild(createLightElement(g, false));
                    });
                    groupDiv.appendChild(lightsRow);
                    logStatusLights.appendChild(groupDiv);
                });
            }

            // 2. Render for Popout Window
            if (popoutWindow && !popoutWindow.closed) {
                const popContainer = popoutWindow.document.getElementById('popout-status-lights');
                if (popContainer) {
                    popContainer.innerHTML = '';
                    renderKeys.forEach(cat => {
                        const groupSection = popoutWindow.document.createElement('div');
                        groupSection.className = 'status-group';
                        
                        const title = popoutWindow.document.createElement('div');
                        title.className = 'group-title';
                        title.innerText = cat;
                        groupSection.appendChild(title);
                        
                        const row = popoutWindow.document.createElement('div');
                        row.className = 'lights-row';
                        grouped[cat].forEach(g => {
                            row.appendChild(createLightElement(g, true));
                        });
                        groupSection.appendChild(row);
                        popContainer.appendChild(groupSection);
                    });
                }
            }
        }
        
        function createLightElement(g, forPopout) {
            const container = forPopout ? popoutWindow.document.createElement('div') : document.createElement('div');
            container.className = "light-container flex flex-col items-center";

            const light = forPopout ? popoutWindow.document.createElement('div') : document.createElement('div');
            light.id = `hud-light-${g.id}`; 
            
            let baseClass = "px-2 py-1 rounded shadow-md font-bold text-xs transition-colors duration-200 border cursor-default select-none max-w-[120px] truncate";
            let activeClass = g.triggerState 
                ? "bg-green-500 text-white shadow-green-500/50 border-white/20" 
                : "bg-red-600/90 text-white shadow-red-900/50 border-white/10";
            
            if (forPopout) {
                light.className = `light ${g.triggerState ? 'green' : 'red'}`;
            } else {
                light.className = `${baseClass} ${activeClass}`;
            }
            
            light.title = g.name; 
            light.innerText = g.name; 
            container.appendChild(light);

            // Timer Span
            const timer = forPopout ? popoutWindow.document.createElement('div') : document.createElement('span');
            timer.id = `hud-timer-${g.id}`;
            if (forPopout) {
                 timer.className = "timer";
            } else {
                 timer.className = "text-[8px] text-white/60 font-mono mt-0.5 h-[12px] opacity-70 leading-none"; 
            }
            container.appendChild(timer);

            return container;
        }
        
        function updateStatusLight(groupId, isTriggered) {
            renderStatusHUD();
        }

        // --- V4.9 Optimized Status Updates ---
        function updateCardStatus(group) {
            const statusEl = document.getElementById(`status-${group.id}`);
            const timerEl = document.getElementById(`timer-${group.id}`);
            
            // Update Status Text & Class (Fallback if not handled in loop)
            if (statusEl) {
                if (group.triggerState) {
                    statusEl.innerText = "🟢 驗證成功";
                    statusEl.className = "text-[10px] bg-green-900/50 text-green-400 px-2 py-0.5 rounded font-bold border border-green-500";
                } else if (!group.latestRects || !group.latestRects.main) {
                    // Only reset text if we are sure we lost the main target or explicitly setting to lost
                    // Note: 'Searching...' is usually set before calling this in non-match cases
                    // But if called from resetGroupStatus or load, we might need defaults
                }
            }

            // Update Timer Style
            if (timerEl) {
                const colorClass = group.triggerState ? "text-green-400" : "text-slate-500";
                timerEl.className = `text-[10px] font-mono ml-2 border-l border-slate-600 pl-2 ${colorClass}`;
            }

            // Update Reset Button (Pre-rendered Logic)
            if (statusEl && statusEl.parentElement && statusEl.parentElement.parentElement) {
                const statusRow = statusEl.parentElement.parentElement; // .flex.justify-between
                const resetBtn = statusRow.querySelector('.reset-btn');
                
                if (resetBtn) {
                    if (group.triggerState) {
                        resetBtn.classList.remove('hidden');
                    } else {
                        resetBtn.classList.add('hidden');
                    }
                }
            }
        }

        function updateHudStatus(group) {
            // Update Main Window HUD Light
            const light = document.getElementById(`hud-light-${group.id}`);
            if (light) {
                let baseClass = "px-2 py-1 rounded shadow-md font-bold text-xs transition-colors duration-200 border cursor-default select-none max-w-[120px] truncate";
                let activeClass = group.triggerState 
                    ? "bg-green-500 text-white shadow-green-500/50 border-white/20"

                light.className = `${baseClass} ${activeClass}`;

        // Drag and Drop Logic for Group List
        let draggedItem = null;

        function handleDragStart(e) {
            this.classList.add('draggable-source');
            draggedItem = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.index);
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault(); 
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            this.classList.add('border-indigo-500');
        }

        function handleDragLeave(e) {
            this.classList.remove('border-indigo-500');
        }

        function handleDrop(e) {
            if (e.stopPropagation) e.stopPropagation(); 
            
            const sourceIndex = parseInt(e.dataTransfer.getData('text/plain'));
            const targetIndex = parseInt(this.dataset.index);
            
            if (isNaN(sourceIndex)) return false; 

            if (sourceIndex !== targetIndex) {
                const item = groups.splice(sourceIndex, 1)[0];
                groups.splice(targetIndex, 0, item);
                saveData();
                renderGroups();
                renderStatusHUD(); 
            }
            return false;
        }

            this.classList.remove('draggable-source');

                    slotsContainer.appendChild(slotEl);
                });

                card.appendChild(slotsContainer);
                groupList.appendChild(card); 
            });
            
            // Re-apply Edit Mode
            document.getElementById('groupList').classList.toggle('is-edit-mode', isEditMode);
        }

        function initiateCrop(groupId, slotType, slotIndex) {
            if(!stream || videoElement.classList.contains('hidden')) {
                showError("請先連接攝影機");
                return;
            }
            activeSlotInfo = { groupId, slotType, slotIndex };
            isCropping = true;
            cropInstruction.classList.remove('hidden');
            const text = slotType === 'main' ? "請框選【定位大範圍】..." : `請在大範圍內框選【特徵點 #${slotIndex+1}】...`;
            cropInstruction.innerHTML = `<i class="fas fa-mouse-pointer mr-2"></i> ${text}`;
            previewScroller.classList.add('crosshair-cursor');
            zoomWrapper.style.cursor = "crosshair";
        }

        // --- Crop Logic ---
        zoomWrapper.addEventListener('mousedown', (e) => {
            if (!isCropping) return;
            e.preventDefault();
            isDragging = true;
            const rect = zoomWrapper.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            cropSelection.style.left = `${startX}px`;
            cropSelection.style.top = `${startY}px`;
            cropSelection.style.width = '0px';
            cropSelection.style.height = '0px';
            cropSelection.style.display = 'block';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging || !isCropping) return;
            const rect = zoomWrapper.getBoundingClientRect();
            let currentX = e.clientX - rect.left;
            let currentY = e.clientY - rect.top;
            currentX = Math.max(0, Math.min(currentX, rect.width));
            currentY = Math.max(0, Math.min(currentY, rect.height));
            const width = currentX - startX;
            const height = currentY - startY;
            cropSelection.style.left = width < 0 ? `${currentX}px` : `${startX}px`;
            cropSelection.style.top = height < 0 ? `${currentY}px` : `${startY}px`;
            cropSelection.style.width = `${Math.abs(width)}px`;
            cropSelection.style.height = `${Math.abs(height)}px`;
        });

        window.addEventListener('mouseup', async (e) => {
            if (!isDragging || !isCropping) return;
            isDragging = false;
            const rect = cropSelection.getBoundingClientRect();
            const wrapperRect = zoomWrapper.getBoundingClientRect();
            isCropping = false;
            cropInstruction.classList.add('hidden');
            previewScroller.classList.remove('crosshair-cursor');
            zoomWrapper.style.cursor = "default";
            cropSelection.style.display = 'none';

            if (rect.width < 10 || rect.height < 10) return;

            try {
                const nativeW = videoNativeWidth || wrapperRect.width;
                const nativeH = videoNativeHeight || wrapperRect.height;
                const ratioW = nativeW / wrapperRect.width;
                const ratioH = nativeH / wrapperRect.height;
                const nx = Math.floor((rect.left - wrapperRect.left) * ratioW);
                const ny = Math.floor((rect.top - wrapperRect.top) * ratioH);
                const nw = Math.floor(rect.width * ratioW);
                const nh = Math.floor(rect.height * ratioH);
                
                if (nw <= 0 || nh <= 0) return;

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = nw;
                tempCanvas.height = nh;
                const ctx = tempCanvas.getContext('2d');
                ctx.drawImage(videoElement, nx, ny, nw, nh, 0, 0, nw, nh);
                
                const displayUrl = tempCanvas.toDataURL();
                const imageData = ctx.getImageData(0, 0, nw, nh);

                if (activeSlotInfo) {
                    const group = groups.find(g => g.id === activeSlotInfo.groupId);
                    if (group) {
                        const newSlotData = {
                            imageData: imageData,
                            scaledData: null,
                            displayUrl: displayUrl,
                            width: nw,
                            height: nh,
                            weightCorrection: 0 // Initialize correction
                        };
                        if (activeSlotInfo.slotType === 'main') {
                            group.mainSlot = newSlotData;
                        } else {
                            group.subSlots[activeSlotInfo.slotIndex] = newSlotData;
                        }
                        renderGroups();
                        saveData(); 
                        showSuccess("已設定圖片");
                    }
                } else if (isScanRegionMode) {
                    const region = { x: nx, y: ny, w: nw, h: nh };
                    scanRegions.push(region);
                    saveData();
                    renderScanRegions();
                    updateScanRegionStatus();
                    showSuccess("已新增搜尋範圍");
                    isScanRegionMode = false; 
                }
            } catch (err) {
                console.error(err);
                showError("截取失敗");
            }
            activeSlotInfo = null;
        });

        // --- Scan Region UI Logic ---
        function initiateRegionCrop() {
            if(!stream || videoElement.classList.contains('hidden')) {
                showError("請先連接攝影機");

            isScanRegionMode = true;
            isCropping = true;
